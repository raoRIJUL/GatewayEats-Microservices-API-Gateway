server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: restaurant-service
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:restaurant_db}?useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: root
    password: passsword
    
    hikari:
      minimum-idle: ${MYSQL_POOL_MIN_SIZE:2}
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    issuer: ${JWT_ISSUER:food-delivery-user-service}
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} logger=%logger{36} message=\"%msg\"%n"
