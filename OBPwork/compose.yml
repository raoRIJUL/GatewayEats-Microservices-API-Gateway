services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_USER: food_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-food_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - food-mysql-data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lfu
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build:
      context: .
      args:
        MODULE: user-service
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: user_db
      MYSQL_USER: food_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-food_password}
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ISSUER: ${JWT_ISSUER:-food-delivery-user-service}
      JWT_TTL: ${JWT_TTL:-PT30M}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-true}
    expose:
      - "8083"
    depends_on:
      mysql:
        condition: service_healthy

  restaurant-service:
    build:
      context: .
      args:
        MODULE: restaurant-service
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: food_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-food_password}
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ISSUER: ${JWT_ISSUER:-food-delivery-user-service}
    expose:
      - "8081"
    depends_on:
      mysql:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        MODULE: order-service
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: order_db
      MYSQL_USER: food_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-food_password}
      RESTAURANT_SERVICE_URL: http://restaurant-service:8081
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ISSUER: ${JWT_ISSUER:-food-delivery-user-service}
    expose:
      - "8082"
    depends_on:
      mysql:
        condition: service_healthy
      restaurant-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      CACHE_REDIS_HOST: redis
      CACHE_REDIS_PORT: 6379
      CACHE_REDIS_DATABASE: 1
      USER_SERVICE_URL: http://user-service:8083
      RESTAURANT_SERVICE_URL: http://restaurant-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      JWT_SECRET: ${JWT_SECRET:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      JWT_ISSUER: ${JWT_ISSUER:-food-delivery-user-service}
      RESTAURANT_CACHE_TTL: ${RESTAURANT_CACHE_TTL:-PT30S}
      RESTAURANT_CACHE_MAX_ENTRY_SIZE: ${RESTAURANT_CACHE_MAX_ENTRY_SIZE:-5MB}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      order-service:
        condition: service_started

volumes:
  food-mysql-data:
